services:
  games:
    build:
      context: .
      target: runtime
    image: playground-h5:local
    init: true
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-}"
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
    volumes:
      - playground_data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  playground_data:
